[package]
name = "helix-web"
version = "0.1.0"
authors = ["makemeunsee <makemeunsee@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# The wasm-bindgen family is pinned exactly: `wasm-pack build` installs a
# wasm-bindgen-cli matching the locked crate version, and CLI releases after
# 0.2.117 require a newer rustc than the 1.82.0 this repo pins.
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.44"
tokio = { version = "1.33", features = ["rt"] }
helix-term = { path = "../helix-term", default-features = false }
helix-tui = { path = "../helix-tui", default-features = false }
helix-view = { path = "../helix-view", default-features = false }
helix-core = { path = "../helix-core" }
helix-loader = { path = "../helix-loader" }
console_log = "1.0"
log = "0.4"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = [
    "Document",
    "Element",
    "KeyboardEvent",
    "Window",
] }
rs-xterm-js = { git = "https://github.com/makemeunsee/rs-xterm-js" }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "=0.3.44"

[build-dependencies]
cc = "1"
helix-loader = { path = "../helix-loader" }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[package.metadata.wasm-pack.profile.release]
# for quicker builds
# wasm-opt = false

# Same patch as the workspace root: tree-house-bindings must be the vendored
# copy so it compiles for wasm32 (helix-web is excluded from the workspace and
# needs its own patch table).
[patch.crates-io]
tree-house-bindings = { path = "../vendor/tree-house-bindings" }
