name: Publish web bundle

# Publishes the `web/pkg` wasm-pack output — the unit the demo consumes as
# `file:../pkg` — as a versioned GitHub release so external embedders can pin
# it. The Pages demo is no substitute: Vite content-hashes its asset names
# and every push to main replaces them, so there is nothing stable to link
# against there.
#
# Triggered by pushing a `web-v<semver>` tag — the repo's only tag namespace
# (the snapshot-attestation tags this once shared the space with went away
# with the pin machinery). To cut a release: make sure `web/Cargo.toml`'s
# `version` matches and `CHANGELOG.md` carries that version's entry — the
# notes below link the changelog *at the tag*, so it has to be on the tagged
# commit — then tag the commit `web-v<version>` and push the tag.
# `workflow_dispatch` exists to re-run a
# failed run and must be dispatched *on the tag ref*
# (`gh workflow run web_release.yml --ref web-v<version>`) — a dispatch on a
# branch ref fails the tag guard below. A re-run after the release was
# already created fails at `gh release create`; releases are not overwritten.

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:

# Serialize runs per ref: a workflow_dispatch fired while the tag-push run
# is still in flight would rebuild the same bundle and lose the race at
# `gh release create` — harmless (releases are never overwritten) but a
# wasted build and a confusing red X. Don't cancel in-progress runs; let
# the first run finish.
concurrency:
  group: "web-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Fail fast, before the build: the run must be on a `web-v*` tag ref,
      # and the tag must equal `web-v` + the helix-web crate version —
      # `web/Cargo.toml` is the source of truth for what version this tree is.
      - name: Check the tag against web/Cargo.toml
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/web-v*) ;;
            *)
              echo "::error::must run on a web-v* tag ref, got $GITHUB_REF"
              exit 1
              ;;
          esac
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' web/Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "web-v$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match web/Cargo.toml version $crate_version (expected web-v$crate_version)"
            exit 1
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install wasm-opt
        uses: ./.github/actions/wasm-opt

      # Two builds of the same tree, differing only in HELIX_WEB_GRAMMARS
      # (web/build.rs): the default grammar set — the same build as the demo
      # deploy (web_demo.yml), locked deps, same pinned binaryen, so what
      # ships is exactly what the demo runs — and the full catalog, several
      # times the size, for embedders who opt into every grammar.
      # Full first: the default build is the one that has to be in web/pkg
      # for the tarball assembly below.
      # Each build also stamps its package with the GRAMMARS.txt the build
      # script writes to OUT_DIR — the linked grammar names, derived from the
      # build rather than a hand-kept list — because wasm-pack's package.json
      # is byte-identical across the two tiers and nothing else in an
      # extracted tree says which one it is. Copied right after each build:
      # both builds share one OUT_DIR, so the second overwrites the first.
      - name: Build the wasm package (full grammar catalog)
        run: |
          HELIX_WEB_GRAMMARS=full wasm-pack build web --target web -- --locked
          cp "$(ls -t target/wasm32-unknown-unknown/release/build/helix-web-*/out/GRAMMARS.txt | head -n1)" web/pkg/
          mv web/pkg web/pkg-full

      - name: Build the wasm package (default grammar set)
        run: |
          wasm-pack build web --target web -- --locked
          cp "$(ls -t target/wasm32-unknown-unknown/release/build/helix-web-*/out/GRAMMARS.txt | head -n1)" web/pkg/

      # LICENSE rides along because the bundle is MPL-2.0 — helix's files and
      # this port's alike — and the package.json wasm-pack generates declares
      # that without shipping the text. NOTICE.md rides along because the wasm
      # statically links the grammar parsers' C sources; their license notices
      # belong with the artifact. CHANGELOG.md rides along because it is what
      # this file versions, and an embedder who vendors the extracted tree has
      # no other copy of it — the release-notes link only helps someone still
      # standing on the release page.
      # The .gitignore wasm-pack emits (it ignores the whole pkg dir) would
      # only confuse an embedder vendoring the extracted tree, so drop it.
      - name: Assemble the tarballs
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir stage
          for tier in "" -full; do
            pkg="web/pkg$tier"
            cp LICENSE "$pkg/"
            cp web/NOTICE.md "$pkg/"
            cp CHANGELOG.md "$pkg/"
            rm -f "$pkg/.gitignore"
            cp -r "$pkg" "stage/helix-web-$version$tier"
            tar -czf "helix-web-$version$tier.tar.gz" -C stage "helix-web-$version$tier"
            tar -tzf "helix-web-$version$tier.tar.gz"
            head -n1 "$pkg/GRAMMARS.txt"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "helix-web $version" \
            --notes "The embeddable wasm bundle: the \`web/pkg\` wasm-pack output (\`--target web\`), with the MPL-2.0 \`LICENSE\` the bundle is under and \`NOTICE.md\` covering the third-party components it statically links. \`helix-web-$version.tar.gz\` links the default grammar set; \`helix-web-$version-full.tar.gz\` links the whole grammar catalog and is several times the size. See [docs/embedding.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/embedding.md) for the pinning and host-wiring recipe, and [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for what changed in this version and what the port cannot do." \
            "helix-web-$version.tar.gz" \
            "helix-web-$version-full.tar.gz"
