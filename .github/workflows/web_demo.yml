name: Deploy web demo
on:
  push:
    branches: [ wasm32 ]
  workflow_dispatch:

# Serialize Pages deploys: deploy-pages has no built-in queuing, so without
# this an older in-flight run could finish after — and overwrite — a newer
# one. Don't cancel in-progress runs; let deploys complete in order.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "16"

      - name: Set up cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # `wasm-pack build` falls back to an unlocked `cargo install wasm-bindgen-cli`
      # under the repo's pinned Rust 1.82.0 toolchain, which fails on edition-2024
      # transitive deps. Pre-install 0.2.117 with a current stable toolchain into
      # the exact cache location wasm-pack checks (binaries must sit at the dir
      # root, not only in bin/). See helix-web/README.md "Setup".
      - name: Pre-install wasm-bindgen-cli into wasm-pack's cache
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install wasm-bindgen-cli --version 0.2.117 --locked \
            --root "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117"
          cp "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117/bin/"* \
            "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117/"

      - name: Build wasm package
        run: |
          cd helix-web
          wasm-pack build --target web

      - name: Install node modules and build static app
        run: |
          cd helix-web/www
          npm install
          npm run build

      # Keep the demo under /demo, preserving the URL layout of the previous
      # gh-pages deploy (https://<owner>.github.io/helix-wasm/demo/). The bare
      # site root gets a small redirect page so it doesn't 404.
      - name: Stage site under /demo
        run: |
          mkdir -p _site/demo
          cp -r helix-web/www/dist/. _site/demo/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=demo/">
            <title>helix-wasm</title>
          </head>
          <body><a href="demo/">Continue to the helix-wasm demo</a></body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
