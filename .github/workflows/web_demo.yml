name: Deploy web demo
on:
  push:
    branches: [ wasm32 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "16"

      - name: Set up cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # `wasm-pack build` falls back to an unlocked `cargo install wasm-bindgen-cli`
      # under the repo's pinned Rust 1.82.0 toolchain, which fails on edition-2024
      # transitive deps. Pre-install 0.2.117 with a current stable toolchain into
      # the exact cache location wasm-pack checks (binaries must sit at the dir
      # root, not only in bin/). See helix-web/README.md "Setup".
      - name: Pre-install wasm-bindgen-cli into wasm-pack's cache
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install wasm-bindgen-cli --version 0.2.117 --locked \
            --root "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117"
          cp "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117/bin/"* \
            "$HOME/.cache/.wasm-pack/wasm-bindgen-cargo-install-0.2.117/"

      - name: Build wasm package
        run: |
          cd helix-web
          wasm-pack build --target web

      - name: Install node modules and build static app
        run: |
          cd helix-web/www
          npm install
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helix-web/www/dist/
          destination_dir: ./demo
          force_orphan: true
