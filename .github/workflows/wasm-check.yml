name: wasm32 check

on:
  push:
    branches: [main]
  # `upstream/**` too: a release-review PR targets the base branch for the
  # release it ports, not main, and that is the PR the whole port gets
  # reviewed in — it needs the same checks.
  pull_request:
    branches: [main, "upstream/**"]

jobs:
  helix-core:
    name: check helix-core (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # `workspaces` decides what survives rust-cache's pre-save cleanup: it
      # keeps the packages whose manifest lives *outside* the workspace root
      # and deletes the rest — a filesystem path test, not cargo workspace
      # membership (`getPackagesOutsideWorkspaceRoot` in the action's
      # src/workspace.ts). helix/ and stubs/ sit inside the checkout, so the
      # default root (`.`) drops all 21 in-tree crates, plus the registry
      # crates that depend on them, and every run recompiles them. Rooting the
      # action at web/ keeps everything except the `helix-web` crate itself —
      # the crate that changes every commit and is cheap to rebuild — while
      # `../target` stays the single shared target dir (a target is resolved
      # relative to its workspace root). The keep-set is a path test, so
      # renaming web/ would silently empty it: move this alongside.
      #
      # `key` carries the lockfile hash because the action only looks for a
      # Cargo.lock at the workspace root and web/ has none. Without it a dep
      # bump would never rotate the cache key, and since the action skips the
      # save entirely on an exact key hit, the cache would stay frozen at its
      # pre-bump contents.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> ../target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Check helix-core for wasm32
        run: cargo check -p helix-core --target wasm32-unknown-unknown --locked
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info

  helix-view:
    name: check helix-view (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache config rationale: see the helix-core job above.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> ../target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Check helix-view for wasm32
        run: cargo check -p helix-view --target wasm32-unknown-unknown --locked

  helix-term:
    name: check helix-term (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache config rationale: see the helix-core job above.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> ../target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Check helix-term for wasm32
        run: cargo check -p helix-term --target wasm32-unknown-unknown --locked

  web-bundle:
    name: build web bundle (wasm-pack + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache config rationale: see the helix-core job above.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> ../target
          key: ${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the wasm package
        run: wasm-pack build web --target web -- --locked

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the host page
        run: |
          cd web/www
          npm ci
          npm run build

      # Advisory report, not a gate: bundle size is a documented concern
      # (roughly 100-500 KB of raw wasm per grammar), so surface the trend
      # on every build; a hard threshold would need a justified budget.
      - name: Report bundle size
        run: |
          {
            echo '### Web bundle size'
            echo
            echo '| File | Raw | Gzip |'
            echo '| --- | ---: | ---: |'
            for file in web/www/dist/index.html web/www/dist/assets/*; do
              raw=$(wc -c < "$file" | tr -d '[:space:]')
              gzip=$(gzip -c "$file" | wc -c | tr -d '[:space:]')
              printf '| %s | %s (%s) | %s (%s) |\n' \
                "$(basename "$file")" \
                "$raw" "$(numfmt --to=iec "$raw")" \
                "$gzip" "$(numfmt --to=iec "$gzip")"
            done
            echo
            echo "Total dist (raw): $(du -sk web/www/dist | cut -f1) KiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        run: |
          cd web/www
          npx playwright install --with-deps chromium

      # Browser smoke tests (web/www/tests) against the dist/ bundle built
      # above — the same artifact the Pages deploy ships.
      - name: Run browser smoke tests
        run: |
          cd web/www
          npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/www/playwright-report/
          retention-days: 7
