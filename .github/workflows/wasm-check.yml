name: wasm32 check

on:
  push:
    branches: [main]
  # `upstream/**` too: a release-review PR targets the base branch for the
  # release it ports, not main, and that is the PR the whole port gets
  # reviewed in — it needs the same checks.
  pull_request:
    branches: [main, "upstream/**"]

jobs:
  helix-core:
    name: check helix-core (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check helix-core for wasm32
        run: cargo check -p helix-core --target wasm32-unknown-unknown --locked

  helix-view:
    name: check helix-view (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check helix-view for wasm32
        run: cargo check -p helix-view --target wasm32-unknown-unknown --locked

  helix-term:
    name: check helix-term (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check helix-term for wasm32
        run: cargo check -p helix-term --target wasm32-unknown-unknown --locked

  # web/NOTICE.md ships with both distributed forms (the release tarball and
  # the deployed page), so its crate table is a published claim about what the
  # wasm links. The table is generated from the dependency graph, and this job
  # is what keeps it from drifting: any Cargo.lock change that adds, drops or
  # bumps a linked crate fails here until the table is regenerated. It also
  # fails on a license identifier the notice has no disposition for, which is
  # the case that needs a human — a new dependency may have brought terms
  # whose text has to be reproduced alongside the artifact.
  notice-crates:
    name: check web/NOTICE.md covers the linked crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # No wasm32 target needed: the generator only resolves the graph for it
      # (`cargo tree --target`), it does not compile anything.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The generator reads each crate's own license files out of the .crate
      # archives in the registry cache, and `cargo fetch` is what populates it.
      - name: Fetch the dependency archives
        run: cargo fetch --locked

      - name: Check the generated crate table
        run: python3 web/notice-crates.py --check

  web-bundle:
    name: build web bundle (wasm-pack + vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install wasm-opt
        uses: ./.github/actions/wasm-opt

      # The full catalog first, as a link gate only: nothing else builds the
      # opt-in grammars before a release does, and a scanner that pulls a
      # libc symbol the sysroot lacks fails only at this link. Then the
      # default set, which is what the browser suite runs against and what
      # the size report below measures — the tarball embedders get.
      # Cache cost of the full build, measured: the build script's OUT_DIR
      # grows to about 480 MB (395 MB of it the 41 shallow grammar checkouts
      # under grammar-sources/) against about 30 MB before the catalog grew.
      # None of it lands in the rust-cache entry: rust-cache prunes
      # target/*/build/<pkg>-* for every workspace member before saving, and
      # helix-web is one, so the checkouts are re-fetched each run exactly as
      # they were with the smaller catalog (#118 quota unaffected).
      - name: Build the wasm package (full grammar catalog, link check)
        run: HELIX_WEB_GRAMMARS=full wasm-pack build web --target web -- --locked

      - name: Build the wasm package (default grammar set)
        run: wasm-pack build web --target web -- --locked

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the host page
        run: |
          cd web/www
          npm ci
          npm run build

      # Advisory report, not a gate: bundle size is a documented concern
      # (a few KB to about 5 MB of static lib per grammar, about 13 MB of raw
      # wasm for the default set and 46 MB for the catalog), so surface the trend
      # on every build; a hard threshold would need a justified budget.
      - name: Report bundle size
        run: |
          {
            echo '### Web bundle size'
            echo
            echo '| File | Raw | Gzip |'
            echo '| --- | ---: | ---: |'
            for file in web/www/dist/index.html web/www/dist/assets/*; do
              raw=$(wc -c < "$file" | tr -d '[:space:]')
              gzip=$(gzip -c "$file" | wc -c | tr -d '[:space:]')
              printf '| %s | %s (%s) | %s (%s) |\n' \
                "$(basename "$file")" \
                "$raw" "$(numfmt --to=iec "$raw")" \
                "$gzip" "$(numfmt --to=iec "$gzip")"
            done
            echo
            echo "Total dist (raw): $(du -sk web/www/dist | cut -f1) KiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The browser is a fixed binary keyed by Playwright's version, so a cache
      # hit changes nothing about what the tests run. Keyed on the resolved
      # version rather than a hash of the lockfile: an unrelated dependency
      # bump must not throw away a 108 MB entry, because this repo's Actions
      # cache is already at its 10 GB quota and evicting LRU (#118).
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(jq -er '.packages["node_modules/playwright-core"].version' web/www/package-lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell

      # Unconditional, not gated on the cache miss: against a restored
      # directory this is a sub-second no-op, and it re-downloads a partial
      # entry rather than leaving one wedged under its version key.
      #
      # `--only-shell` installs just chrome-headless-shell, which is what a
      # headless `chromium` project with no channel launches — skipping the
      # full Chrome-for-Testing build halves what the cache has to hold.
      # No `--with-deps`: on the ubuntu-latest image (ubuntu-24.04, image
      # 20260810.271)
      # every shared library Playwright wants is already installed, and the
      # only packages apt adds are the CJK/Cyrillic/Thai font sets this suite
      # never renders. If a future image drops one, the failure surfaces as a
      # browser-launch error in the test step, not as a missing package here.
      - name: Install Playwright Chromium
        run: |
          cd web/www
          npx playwright install --only-shell chromium

      # Browser smoke tests (web/www/tests) against the dist/ bundle built
      # above — the same artifact the Pages deploy ships.
      - name: Run browser smoke tests
        run: |
          cd web/www
          npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/www/playwright-report/
          retention-days: 7
