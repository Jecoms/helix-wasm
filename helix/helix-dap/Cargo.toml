# Patched for wasm32-unknown-unknown: the debug-adapter subprocess and TCP
# machinery is removed, since the browser has neither. The delta from
# upstream 25.07.1:
#   - tokio's `process` and `net` features are dropped (both pull in mio,
#     which does not build for wasm32)
#   - `stdio` keeps upstream's `which(cmd)?` line (which always fails on
#     wasm32, yielding `Error::ExecutableNotFound`) and drops the spawn that
#     followed; `tcp` / `tcp_process` return errors instead of connecting;
#     `process` itself is upstream's verbatim dispatch body
#   - the `Client._process: Option<Child>` field is removed, `streams()`
#     loses its `process: Option<Child>` parameter, and the private
#     `get_port()` helper (tokio::net) is deleted
# The protocol types, transport pump (generic over async streams), and
# registry are the pristine upstream code.
[package]
name = "helix-dap"
description = "DAP client implementation for Helix project"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
helix-stdx = { path = "../helix-stdx" }
helix-core = { path = "../helix-core" }

anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "macros", "fs", "parking_lot", "sync"] }
thiserror.workspace = true
slotmap.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true


[dev-dependencies]
fern = "0.7"
