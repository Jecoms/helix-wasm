[package]
name = "helix-tui"
description = """A library to build rich terminal user interfaces or dashboards"""
include = ["src/**/*", "README.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["crossterm"]
# termini pulls in the `home` crate, which does not build for
# wasm32-unknown-unknown; only the crossterm backend needs terminfo.
crossterm = ["dep:crossterm", "dep:termini"]

[dependencies]
helix-core = { path = "../helix-core" }

bitflags.workspace = true
cassowary = "0.3"
unicode-segmentation.workspace = true
crossterm = { version = "0.28", optional = true }
termini = { version = "1.0", optional = true }
once_cell = "1.21"
log = "~0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
helix-view = { path = "../helix-view", default-features = false }
tokio = { version = "1", features = ["io-util"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
helix-view = { path = "../helix-view", default-features = false, features = ["term"] }
