# Vendored copy of upstream helix-lsp 25.07.1 (from the `helix/25.07.1-r3`
# snapshot) with the language-server subprocess machinery removed so the
# crate builds for wasm32-unknown-unknown:
#   - tokio's `process` feature is dropped (it pulls in mio, which does not
#     build for wasm32)
#   - `Client::start` keeps upstream's `which(cmd)?` line (which always
#     fails on wasm32, yielding `Error::ExecutableNotFound`) and drops the
#     server spawn that followed; the `Client._process: Child` field and its
#     construction are removed with it
#   - transport.rs is trimmed to the `Payload` type; the stdio pump is gone
#   - `file_event::Handler::new` spawns its worker only when a tokio runtime
#     exists (`Handle::try_current()`); upstream spawns unconditionally,
#     which would panic on wasm32 where no runtime is ever entered
# Everything else (util conversions, jsonrpc, Registry, progress tracking)
# is the pristine upstream code, so editor logic behaves identically —
# there is simply never a running language server.
[package]
name = "helix-lsp"
description = "wasm32 stub of the Helix LSP client (no subprocess support)"
version = "25.7.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
helix-stdx = { git = "https://github.com/Jecoms/helix-wasm.git", branch = "helix/25.07.1-r3" }
helix-core = { git = "https://github.com/Jecoms/helix-wasm.git", branch = "helix/25.07.1-r3" }
helix-loader = { git = "https://github.com/Jecoms/helix-wasm.git", branch = "helix/25.07.1-r3" }
helix-lsp-types = { git = "https://github.com/Jecoms/helix-wasm.git", branch = "helix/25.07.1-r3" }

anyhow = "1.0"
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
globset = "0.4.16"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46", features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "macros", "fs", "parking_lot", "sync"] }
tokio-stream = "0.1.17"
parking_lot = "0.12"
arc-swap = "1"
slotmap = "1.0.7"
thiserror = "2.0"
