[package]
edition = "2021"
rust-version = "1.76.0"
name = "tree-house-bindings"
version = "0.2.4"
authors = [
    "Pascal Kuthe <pascalkuthe@pm.me>",
    "Michael Davis <mcarsondavis@gmail.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Homey Rust bindings for the tree-sitter C library"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/helix-editor/tree-house"

[features]
ropey = ["dep:ropey"]
tree-sitter-language = ["dep:tree-sitter-language"]

[lib]
name = "tree_house_bindings"
path = "src/lib.rs"

[dependencies.libloading]
version = "0.8"

[dependencies.regex-cursor]
version = "0.1.5"

[dependencies.ropey]
version = "1.6"
optional = true
default-features = false

[dependencies.thiserror]
version = "2.0"

[dependencies.tree-sitter-language]
version = "0.1.5"
optional = true

[build-dependencies.cc]
version = "1.0"
