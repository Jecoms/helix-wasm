#
# Delta 1 — the ABI fix:
#   - `ts_query_cursor_set_byte_range` is declared with the `-> bool` that the
#     C function actually returns (`vendor/include/tree_sitter/api.h:1129`,
#     `vendor/src/query.c:3210`, both line numbers in the tree-sitter v0.25.9
#     that vendor/ holds). Upstream declares no return type. Native targets
#     tolerate the mismatch; wasm32 checks indirect-call signatures and traps
#     with `signature_mismatch` the first time a query cursor runs, which is
#     every syntax-highlighted buffer.
#
# Both call sites discard the result, so the fix is confined to the
# declaration. This replaces a `git =` patch on a personal fork of
# tree-house, which was deleted (see issue #79); vendoring keeps the build
# resolvable from this repo alone.
#
# Delta 2 — the tree cursor quadratic (issue #92):
#   - `ts_tree_cursor_current_status` (`vendor/src/tree_cursor.c:499`) answers
#     "does the node the cursor is on have a later sibling, and a later
#     *named* sibling" by scanning that node's remaining siblings. A query
#     cursor calls it once per node it enters (`vendor/src/query.c:3758`, its
#     only caller), so querying a node with N children costs O(N²). Parse
#     errors are where N gets large: a run of unbalanced delimiters puts every
#     token in one flat `ERROR` node, and upstream does not compress those the
#     way it compresses repetitions in a valid tree. Both answers depend on
#     the whole child list rather than on where the scan starts, so the delta
#     summarizes that list once onto the parent's cursor-stack entry
#     (`vendor/src/tree_cursor.h`'s `TreeCursorEntry`) and answers each child
#     by comparing indices. Same flags, linear walk.
#
# Not a wasm32 gap: upstream tree-sitter `master` still scans (it changed the
# loop's guard, which does not change the complexity), so native helix has
# this too. It is carried here because the browser has no way to interrupt a
# frozen main thread. Report it upstream and drop this when it lands there.
#
# Verified by differential testing rather than by inspection: parse a corpus
# across the linked grammars, run every query set over each tree, and dump
# every match's pattern, captures and node ranges. That output must be
# byte-identical to a build of the pristine vendor/ tree — including for
# inputs that interleave extras and aliases, which is what the scan's
# structural-child-index bookkeeping is sensitive to.
#
# build.rs is upstream's, untouched — including the fact that its
# `cargo:rerun-if-changed` loop covers only the top level of vendor/src and
# misses vendor/include/ plus the unicode/, portable/, and wasm/
# subdirectories. That was moot under a `git =` dep (cargo fingerprints those
# by pinned revision), but a `path =` dep is fingerprinted by these
# declarations, so a hand edit under those paths would not force a rebuild.
# Left alone deliberately: patching it would cost the pristine-except-one-
# file property the recipe above checks, and vendor/ is regenerated wholesale
# by vendor.sh rather than edited in place. `cargo clean -p
# tree-house-bindings` forces the rebuild if you ever do edit it by hand.
# Delta 2 is unaffected: both files it touches sit at the top level of
# vendor/src, which the loop does cover.
#
# Retire delta 1 when upstream ships the fix in a release helix depends on. As
# of 2026-08-16 it is still absent from the newest published version (0.3.2)
# and helix-editor/tree-house#40 was closed unmerged, so this is not imminent.
# Delta 2 retires against tree-sitter itself, not tree-house.
