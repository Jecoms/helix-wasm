#
# Delta 1 — the ABI fix:
#   - `ts_query_cursor_set_byte_range` is declared with the `-> bool` that the
#     C function actually returns (`vendor/include/tree_sitter/api.h:1129`,
#     `vendor/src/query.c:3210`, both line numbers in the tree-sitter v0.25.9
#     that vendor/ holds). Upstream declares no return type. Native targets
#     tolerate the mismatch; wasm32 checks indirect-call signatures and traps
#     with `signature_mismatch` the first time a query cursor runs, which is
#     every syntax-highlighted buffer.
#
# Both call sites discard the result, so the fix is confined to the
# declaration. This replaces a `git =` patch on a personal fork of
# tree-house, which was deleted (see issue #79); vendoring keeps the build
# resolvable from this repo alone.
#
# Delta 2 — the tree cursor quadratic (issue #92):
#   - `ts_tree_cursor_current_status` (`vendor/src/tree_cursor.c:499`) answers
#     "does the node the cursor is on have a later sibling, and a later
#     *named* sibling" by scanning that node's remaining siblings. A query
#     cursor calls it once per node it enters (`vendor/src/query.c:3758`, its
#     only caller), so querying a node with N children costs O(N²). Parse
#     errors are where N gets large: a run of unbalanced delimiters puts every
#     token in one flat `ERROR` node, and upstream does not compress those the
#     way it compresses repetitions in a valid tree. Both answers depend on
#     the whole child list rather than on where the scan starts, so the delta
#     summarizes that list once onto the parent's cursor-stack entry
#     (`vendor/src/tree_cursor.h`'s `TreeCursorEntry`) and answers each child
#     by comparing indices. Same flags, linear walk.
#
# Not a wasm32 gap: upstream tree-sitter `master` still scans (it changed the
# loop's guard, which does not change the complexity), so native helix has
# this too. It is carried here because the browser has no way to interrupt a
# frozen main thread. Report it upstream and drop this when it lands there.
#
# This is the first change this repo makes under vendor/, so note what the
# refresh recipe above does not cover: that recipe re-checks the crates.io
# package, but the tree-sitter C under vendor/ comes from vendor.sh, which
# opens with `rm -rf vendor` and re-clones the pinned tag. Running it drops
# delta 2 on the floor — silently, since the result still builds and still
# passes, just slowly again. Re-apply it afterwards, and re-run the
# differential check below.
#
# Verified by differential testing rather than by inspection: parse a corpus
# across the linked grammars, run every query set over each tree, and dump
# every match's pattern, captures and node ranges. That output must be
# byte-identical to a build of the pristine vendor/ tree — including for
# inputs that interleave extras and aliases, which is what the scan's
# structural-child-index bookkeeping is sensitive to.
#
# build.rs is upstream's, untouched — including the fact that its
# `cargo:rerun-if-changed` loop covers only the top level of vendor/src and
# misses vendor/include/ plus the unicode/, portable/, and wasm/
# subdirectories. That was moot under a `git =` dep (cargo fingerprints those
# by pinned revision), but a `path =` dep is fingerprinted by these
# declarations, so a hand edit under those paths would not force a rebuild.
# Left alone deliberately: patching it would add a fifth file to the four the
# recipe above checks for, and it would buy nothing here — delta 2 touches
# vendor/src/tree_cursor.{c,h}, both at the top level of vendor/src, which the
# loop does cover, and delta 3 is Rust, which cargo fingerprints itself.
# `cargo clean -p tree-house-bindings` forces the rebuild if a later delta
# ever does land under one of the missed paths.
#
# Delta 3 — a deadline on query cursors (issue #120):
#   - `InactiveQueryCursor::set_default_timeout` sets a process-wide wall clock
#     budget, and `InactiveQueryCursor::new` arms every cursor it hands out
#     with it via `ts_query_cursor_set_timeout_micros`. Zero, the value the
#     crate starts at, is upstream's behavior: no deadline.
#
# Helix gives tree-sitter a 500 ms budget for a parse, but tree-house then
# walks the finished tree twice more per layer — the injection query and the
# local query — on cursors it builds itself and threads no timeout into. Those
# walks are linear in the size of the tree and have no ceiling, and on wasm32
# they run on a main thread the browser cannot interrupt. The budget has to
# arrive as a default because the constructor is the only surface this repo
# can reach: `Syntax::update` and both query walks are tree-house's, consumed
# from crates.io, and only these bindings are vendored here.
#
# The C side needs no change. tree-sitter arms the deadline from `clock_now()`
# at `ts_query_cursor_exec` (`vendor/src/query.c:3186`) and samples it once per
# 100 cursor operations (`:3628`) — the same clock, and the same sampling rate,
# as the parse timeout it already honors, which on wasm32 is the
# `clock_gettime` shim over the page's `performance.now()` (sysroot/shims.c).
# A cursor that runs out stops yielding matches; the caller sees a query that
# ended early, so highlighting degrades rather than the tab freezing.
#
# Not a wasm32 gap either — native helix has the same unbounded walks. It is
# carried here for the same reason as delta 2: a frozen browser main thread
# has no escape hatch.
#
# Retire delta 1 when upstream ships the fix in a release helix depends on. As
# of 2026-08-16 it is still absent from the newest published version (0.3.2)
# and helix-editor/tree-house#40 was closed unmerged, so this is not imminent.
# Delta 2 retires against tree-sitter itself, not tree-house. Delta 3 retires
# if tree-house ever spends one deadline across a whole `Syntax::update`,
# which is the fix that belongs upstream; short of that it needs porting
# rather than dropping when tree-sitter 0.26 removes
# `ts_query_cursor_set_timeout_micros` (deprecated in 0.25), whose replacement
# is a progress callback on `ts_query_cursor_exec_with_options` — a Rust
# callback, which means supplying the clock from Rust instead of borrowing
# tree-sitter's.
