# Vendored copy of tree-house-bindings 0.2.4 (MPL-2.0, see LICENSE) with one
# extern declaration corrected so tree-sitter queries do not trap on wasm32.
# Everything outside src/query_cursor.rs is the pristine crates.io package
# (this Cargo.toml is the cargo-normalized one from the .crate archive,
# including the generated banner below). The delta:
#   - `ts_query_cursor_set_byte_range` is declared with the `-> bool` that the
#     C function actually returns (`vendor/include/tree_sitter/api.h:1107`,
#     `vendor/src/query.c:3454`). Upstream declares no return type. Native
#     targets tolerate the mismatch; wasm32 checks indirect-call signatures
#     and traps with `signature_mismatch` the first time a query cursor runs,
#     which is every syntax-highlighted buffer.
#
# Both call sites discard the result, so the fix is confined to the
# declaration. This replaces a `git =` patch on a personal fork of
# tree-house, which was deleted (see issue #79); vendoring keeps the build
# resolvable from this repo alone.
#
# Retire when upstream ships the fix in a release helix depends on. As of
# 2026-08-16 it is still absent from the newest published version (0.3.2) and
# helix-editor/tree-house#40 was closed unmerged, so this is not imminent.
