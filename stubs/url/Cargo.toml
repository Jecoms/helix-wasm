# path conversion made to work on wasm32-unknown-unknown. Everything outside
# src/lib.rs is the pristine crates.io package (this Cargo.toml is the
# cargo-normalized one from the .crate archive). The delta, all in
# src/lib.rs and gated on `target_arch = "wasm32"` (vendored stubs keep the
# upstream-ecosystem cfg style rather than this repo's `target_family`
# convention):
#   - `path_to_file_url_segments` / `file_url_segments_to_pathbuf` (the
#     `from_file_path`/`to_file_path` backends) compile for wasm32 alongside
#     unix/redox/wasi/hermit, via a local `OsStrExt::as_bytes` shim (paths
#     are UTF-8 there) and `String`-based `PathBuf` construction; the
#     `socket_addrs`/`io` cfg lists grow the same `target_arch = "wasm32"`
#     arm
#   - root tests use `has_root()` instead of `is_absolute()` (in
#     `path_to_file_url_segments` and the `file_url_segments_to_pathbuf`
#     debug_assert): `is_absolute()` is always false on
#     wasm32-unknown-unknown (`has_root() && prefix().is_some()`, and only
#     Windows has prefixes), which rejected every path
