# The browser frontend: a wasm-bindgen cdylib that boots helix-term against
# the crossterm browser shim and exposes the small JS surface the host page
# drives (see www/). Only meaningful for wasm targets — on native the crate
# compiles down to just the pure `mouse` decoding module (and its unit
# tests, so `cargo test -p helix-web` runs natively) and plain `cargo check`
# of the workspace stays cheap and green.
[package]
name = "helix-web"
# The source of truth for what version this tree is: `web_release.yml`
# refuses a tag that is not `web-v` + this string, and it names the tarball.
# Bumping it is step one of cutting a release — see the README's "Embedding
# the editor".
version = "0.0.2"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Resolves to the browser shim in stubs/ via the workspace [patch] table;
# the frontend needs its `bridge` module directly, and the `mouse` decoding
# module needs the event types on every target (the shim is pure Rust and
# builds natively, so the mouse decoder's unit tests run under native
# cargo test).
crossterm = "0.28"

[target.'cfg(target_family = "wasm")'.dependencies]
helix-wasm = { path = ".." }
# For the `Grammar` type the statically linked `tree_sitter_<lang>` entry
# points return — the same tree-house build the helix crates use (its
# bindings resolve to the patched fork via the workspace [patch] table).
tree-house = { version = "0.3.0", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
console_log = "1.0"
log = "0.4"
# The clock behind the `clock_gettime` shim in ../sysroot/shims.c: the same
# crate — and so the same `performance.now()` timeline — the helix crates
# already read `Instant` from on wasm32.
web-time = "1"

[build-dependencies]
cc = "1"
