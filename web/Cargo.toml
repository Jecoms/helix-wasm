# The browser frontend: a wasm-bindgen cdylib that boots helix-term against
# the crossterm browser shim and exposes the small JS surface the host page
# drives (see www/). Only meaningful for wasm targets — on native the crate
# compiles down to just the pure input-decoding modules (and their unit
# tests, so `cargo test -p helix-web` runs natively) and plain `cargo check`
# of the workspace stays cheap and green.
[package]
name = "helix-web"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Resolves to the browser shim in stubs/ via the workspace [patch] table;
# the frontend needs its `bridge` module directly, and the input-decoding
# modules need the event types on every target (the shim is pure Rust and
# builds natively, so the decoders' unit tests run under native cargo test).
crossterm = "0.28"

[target.'cfg(target_family = "wasm")'.dependencies]
helix-wasm = { path = ".." }
# For the `Grammar` type the statically linked `tree_sitter_<lang>` entry
# points return — the same tree-house build the helix crates use (its
# bindings resolve to the patched fork via the workspace [patch] table).
tree-house = { version = "0.3.0", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
console_log = "1.0"
log = "0.4"

[build-dependencies]
cc = "1"
