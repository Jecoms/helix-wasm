[package]
name = "helix-wasm"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
publish = false

# The patched helix source lives in helix/ — upstream's 25.07.1 release tree
# plus the wasm patch set, as ordinary commits. Path dependencies, so editing
# a helix file is an edit in this workspace.
[dependencies]
helix-core = { path = "helix/helix-core" }
helix-view = { path = "helix/helix-view" }
# No default features: `git` would enable helix-vcs's gix integration, which
# is dead weight in a browser (there is no repository to diff against).
# helix-term drags in crossterm (via helix-tui and helix-view's `term`
# feature); the crossterm it gets is the browser shim swapped in below.
helix-term = { path = "helix/helix-term", default-features = false }
helix-loader = { path = "helix/helix-loader" }
# For `helix_stdx::vfs`, the in-memory virtual file system document IO goes
# through on wasm32 — re-exported so embedders can inject and extract files.
helix-stdx = { path = "helix/helix-stdx" }

# Transitive dependencies swapped for the stubs in stubs/ — all but one
# because they have no wasm32-unknown-unknown support; the exception is
# called out inline below. Each stub's Cargo.toml header documents its delta
# from upstream and why the substitution is safe.
[patch.crates-io]
# Vendored copy with the OS terminal layer replaced by a browser bridge —
# input events and the terminal size come from `crossterm::bridge`, which the
# wasm frontend feeds. See stubs/crossterm/Cargo.toml for the exact delta.
crossterm = { path = "stubs/crossterm" }
home = { path = "stubs/home" }
# Vendored copy whose matcher threadpool is optional: pickers' match runs
# execute inline on wasm32, where rayon can build no custom pool. See
# stubs/nucleo/Cargo.toml for the exact delta.
nucleo = { path = "stubs/nucleo" }
which = { path = "stubs/which" }
libloading = { path = "stubs/libloading" }
url = { path = "stubs/url" }
# The exception: not a wasm32 gap — an ABI fix. This crate builds for wasm32
# unpatched. The vendored copy declares `ts_query_cursor_set_byte_range` with
# the C function's `bool` return; without it wasm32 traps with
# signature_mismatch the moment a query cursor runs. Two further deltas ride
# along, both about not freezing the browser's main thread: a quadratic
# removed from the tree cursor, and a wall-clock budget on query cursors so
# that the walks helix's parse timeout does not reach are bounded too. It also
# carries the only third-party C in stubs/ (a vendored tree-sitter, see
# web/NOTICE.md). See stubs/tree-house-bindings/Cargo.toml for the exact
# deltas.
tree-house-bindings = { path = "stubs/tree-house-bindings" }

# helix/ is its own workspace (upstream's, left pristine) and stays excluded
# from this one: a package cannot belong to two workspaces, and excluding it
# is what keeps `workspace = true` inheritance in helix/helix-*/Cargo.toml
# resolving against helix/Cargo.toml. The helix crates still resolve — as
# path dependencies above — and one Cargo.lock covers everything.
[workspace]
members = ["web"]
exclude = ["stubs", "helix"]

# wasm-pack builds the web crate with --release; favor size, the demo ships
# over the network.
[profile.release]
opt-level = "s"
