[package]
name = "helix-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
helix-core = { git = "https://github.com/Jecoms/helix-wasm.git", branch = "helix-patched" }

# Transitive dependencies with no wasm32-unknown-unknown support, swapped for
# the stubs in stubs/. See SPIKE-NOTES.md for why each is safe to stub.
[patch.crates-io]
home = { path = "stubs/home" }
which = { path = "stubs/which" }
libloading = { path = "stubs/libloading" }
url = { path = "stubs/url" }

[workspace]
exclude = ["stubs"]
